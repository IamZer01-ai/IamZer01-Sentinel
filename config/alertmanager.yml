# ═══════════════════════════════════════════════════════════
# IamZer01 Sentinel – Alertmanager Configuration
# Version 1.0
# ═══════════════════════════════════════════════════════════

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: default
      repeat_interval: 4h

receivers:
  - name: "default"
    email_configs:
      - to: "{{ .Values.alert_email }}"
        from: "sentinel@iamzer01.local"
        smarthost: "localhost:25"
        require_tls: false

  - name: "critical"
    email_configs:
      - to: "{{ .Values.alert_email }}"
        from: "sentinel@iamzer01.local"
        smarthost: "localhost:25"
        require_tls: false
    slack_configs:
      - api_url: "{{ .Values.slack_webhook_url }}"
        channel: "#soc-alerts"
        title: "🚨 [CRITICAL] {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
