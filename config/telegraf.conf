# ═══════════════════════════════════════════════════════════
# IamZer01 Sentinel – Telegraf Configuration
# Version 1.0
# ═══════════════════════════════════════════════════════════

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "5s"
  precision = ""
  hostname = ""
  omit_hostname = false

# ─── OUTPUT: InfluxDB v2 ────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# ─── OUTPUT: Prometheus Client (for Grafana to query) ──────
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  path = "/metrics"

# ─── INPUT: System CPU ──────────────────────────────────────
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# ─── INPUT: System Memory ───────────────────────────────────
[[inputs.mem]]
  fieldpass = ["used_percent", "available_percent", "total", "used", "available", "free"]

# ─── INPUT: System Disk ─────────────────────────────────────
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
  fieldpass = ["used_percent", "total", "used", "free", "inodes_free", "inodes_used"]

# ─── INPUT: Disk I/O ───────────────────────────────────────
[[inputs.diskio]]

# ─── INPUT: Network ─────────────────────────────────────────
[[inputs.net]]
  interfaces = ["eth0", "ens*", "enp*"]
  fieldpass = ["bytes_recv", "bytes_sent", "packets_recv", "packets_sent", "err_in", "err_out", "drop_in", "drop_out"]

# ─── INPUT: Network Statistics ──────────────────────────────
[[inputs.netstat]]
  fieldpass = ["tcp_established", "tcp_time_wait", "tcp_close_wait", "tcp_listen", "udp_socket"]

# ─── INPUT: System Load ─────────────────────────────────────
[[inputs.system]]
  fieldpass = ["load1", "load5", "load15", "uptime", "n_cpus", "n_users"]

# ─── INPUT: Processes ───────────────────────────────────────
[[inputs.processes]]
  fieldpass = ["running", "sleeping", "total", "zombies", "dead"]

# ─── INPUT: Docker ──────────────────────────────────────────
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_names = []
  gather_services = false
  timeout = "5s"
  perdevice = true
  total = true

# ─── INPUT: Kernel ──────────────────────────────────────────
[[inputs.kernel]]
  fieldpass = ["boot_time", "context_switches", "entropy_avail", "interrupts", "processes_forked"]

# ─── INPUT: Swap ────────────────────────────────────────────
[[inputs.swap]]
  fieldpass = ["used_percent", "total", "used", "free"]

# ─── INPUT: Internal Telegraf metrics ──────────────────────
[[inputs.internal]]
  collect_memstats = true
