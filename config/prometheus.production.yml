global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - "/etc/prometheus/rules/soc_alerts.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sentinel-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["sentinel-backend:8000"]
