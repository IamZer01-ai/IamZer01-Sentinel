name: Sentinel site validation and deployment

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/sentinel-site.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/sentinel-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static SOC console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check frontend/app.js
      - name: Check required frontend files
        run: |
          test -s frontend/index.html
          test -s frontend/styles.css
          test -s frontend/app.js
          test -s frontend/README.md
      - name: Verify demo/live-data safety labels
        run: |
          grep -q "DEMO DATA" frontend/index.html
          grep -q "Not connected" frontend/index.html
          grep -q "live_upstream_telemetry_verified:false" frontend/app.js || grep -q "live_upstream_telemetry_verified: false" frontend/app.js
      - name: Check HTML has required structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("frontend/index.html").read_text()
          for token in ('<!doctype html>', '<html lang="en">', 'id="alert-rows"', 'id="alert-search"', 'id="severity-filter"', 'styles.css', 'app.js'):
              assert token in html, f"Missing required HTML marker: {token}"
          print("Required HTML markers found.")
          PY

  deploy:
    name: Deploy Sentinel console to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: sentinel-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: sentinel-pages-${{ github.run_id }}-${{ github.run_attempt }}
