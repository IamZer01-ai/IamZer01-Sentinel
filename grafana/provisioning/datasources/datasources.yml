# ═══════════════════════════════════════════════════════════
# IamZer01 Sentinel – Grafana Datasource Provisioning
# Version 1.0
# ═══════════════════════════════════════════════════════════

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    editable: true
    jsonData:
      version: Flux
      organization: sentinel
      defaultBucket: sentinel
      tlsSkipVerify: true
    secureJsonData:
      token: sentinel-token

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: true
    jsonData:
      esVersion: 8.15.0
      timeField: "@timestamp"
